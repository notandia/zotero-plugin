name: Prepare reader release

on:
  push:
    branches:
      - fix/pmc-reader-scanning

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pmc-reader-scanning
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply release fixes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          module = Path('src/modules/mdpiFilter.ts')
          text = module.read_text()
          old = 'https://www.ncbi.nlm.nih.gov/pmc/utils/idconv/v1.0/'
          new = 'https://pmc.ncbi.nlm.nih.gov/tools/idconv/api/v1/articles/'
          if old not in text:
              raise SystemExit('old NCBI endpoint not found')
          module.write_text(text.replace(old, new))

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['version'] = '0.1.1'
          package['description'] = 'Identify MDPI publications and references in Zotero libraries and reader documents.'
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          PY
          npm install --package-lock-only --ignore-scripts
          npx prettier --write src/modules/mdpiFilter.ts src/modules/referenceScanner.ts src/hooks.ts test/mdpiFilter.spec.ts addon/locale/en-US/addon.ftl package.json package-lock.json .github/workflows/ci.yml
          npm run lint:check
          npm run build
          git rm .github/workflows/prepare-reader-release.yml
      - name: Commit prepared release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/mdpiFilter.ts src/modules/referenceScanner.ts src/hooks.ts test/mdpiFilter.spec.ts addon/locale/en-US/addon.ftl package.json package-lock.json .github/workflows/ci.yml .github/workflows/prepare-reader-release.yml
          git commit -m "fix: scan MDPI references in Zotero reader"
          git push origin HEAD:fix/pmc-reader-scanning
