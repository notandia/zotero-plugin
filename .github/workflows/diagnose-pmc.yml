name: Diagnose PMC references

on:
  push:
    branches:
      - security/public-ready

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query authoritative endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics

          fetch() {
            local name="$1"
            local url="$2"
            printf '%s\n' "$url" > "diagnostics/${name}.url.txt"
            curl --fail-with-body --location --retry 3 \
              --connect-timeout 15 --max-time 60 \
              --dump-header "diagnostics/${name}.headers.txt" \
              --output "diagnostics/${name}.body" \
              "$url" || true
          }

          fetch search 'https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:28615996%20AND%20SRC:MED&resultType=core&format=json'
          fetch med-references 'https://www.ebi.ac.uk/europepmc/webservices/rest/MED/28615996/references?page=1&pageSize=1000&format=json'
          fetch pmc-references 'https://www.ebi.ac.uk/europepmc/webservices/rest/PMC/PMC5469049/references?page=1&pageSize=1000&format=json'
          fetch fulltext-xml 'https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5469049/fullTextXML'
          fetch pmc-oai 'https://pmc.ncbi.nlm.nih.gov/api/oai/v1/mh/?verb=GetRecord&identifier=oai:pubmedcentral.nih.gov:5469049&metadataPrefix=pmc'
          fetch pmc-page 'https://pmc.ncbi.nlm.nih.gov/articles/PMC5469049/'

          python - <<'PY'
          from pathlib import Path
          for path in sorted(Path('diagnostics').glob('*.body')):
              data = path.read_bytes()
              print(path.name, len(data), data[:200])
          PY

      - name: Upload diagnostics
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pmc-api-diagnostics
          path: diagnostics
          if-no-files-found: error
          retention-days: 7
