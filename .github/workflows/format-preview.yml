name: Format Preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format mapper files
        run: npx prettier --write src/modules/workIdentifiers.ts test/workIdentifiers.spec.ts tsconfig.json
      - name: Upload formatted files
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: formatted-work-identifier-files
          path: |
            src/modules/workIdentifiers.ts
            test/workIdentifiers.spec.ts
            tsconfig.json
          if-no-files-found: error
          retention-days: 1
