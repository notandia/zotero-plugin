name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and build
        run: |
          npm run lint:check
          npm run build

      - name: Publish XPI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          XPI="$(find .scaffold/build -type f -name '*.xpi' -print -quit)"
          test -n "$XPI"
          ASSET="mdpi-filter-zotero-${TAG}.xpi"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$XPI#$ASSET" --clobber
          else
            gh release create "$TAG" "$XPI#$ASSET" \
              --target "$GITHUB_SHA" \
              --title "MDPI Filter for Zotero ${TAG}" \
              --generate-notes
          fi
