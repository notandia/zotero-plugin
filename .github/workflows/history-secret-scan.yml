name: Full-history secret scan

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  trufflehog:
    if: github.head_ref == 'security/public-ready'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan all reachable history with TruffleHog
        uses: trufflesecurity/trufflehog@17456f8c7d042d8c82c9a8ca9e937231f9f42e26 # v3.95.2
        with:
          path: ./
          base: ""
          head: ${{ github.event.pull_request.head.sha }}
          version: "3.95.2"
          extra_args: --only-verified

  high-confidence-patterns:
    if: github.head_ref == 'security/public-ready'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan every historical blob for high-confidence secret formats
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          patterns = {
              "private-key": re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----"),
              "github-token": re.compile(rb"\b(?:gh[pousr]_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{40,})\b"),
              "aws-access-key": re.compile(rb"\b(?:AKIA|ASIA)[A-Z0-9]{16}\b"),
              "google-api-key": re.compile(rb"\bAIza[0-9A-Za-z_-]{35}\b"),
              "slack-token": re.compile(rb"\bxox[baprs]-[0-9A-Za-z-]{20,}\b"),
              "stripe-live-key": re.compile(rb"\b(?:sk|rk)_live_[0-9A-Za-z]{20,}\b"),
          }

          objects = subprocess.check_output(
              ["git", "rev-list", "--objects", "--all"], text=True
          ).splitlines()
          seen = set()
          findings = []
          for row in objects:
              oid, _, path = row.partition(" ")
              if oid in seen:
                  continue
              seen.add(oid)
              kind = subprocess.run(
                  ["git", "cat-file", "-t", oid],
                  text=True,
                  capture_output=True,
                  check=False,
              ).stdout.strip()
              if kind != "blob":
                  continue
              size_text = subprocess.check_output(
                  ["git", "cat-file", "-s", oid], text=True
              ).strip()
              if int(size_text) > 2_000_000:
                  continue
              data = subprocess.check_output(["git", "cat-file", "blob", oid])
              for name, pattern in patterns.items():
                  for match in pattern.finditer(data):
                      findings.append((name, oid, path or "<unknown>", match.start()))

          report = Path("secret-history-report.txt")
          if findings:
              report.write_text(
                  "\n".join(
                      f"{name}\t{oid}\t{path}\tbyte:{offset}"
                      for name, oid, path, offset in findings
                  )
                  + "\n"
              )
              print(report.read_text())
              raise SystemExit(f"Found {len(findings)} high-confidence secret candidate(s)")

          report.write_text(
              f"Scanned {len(seen)} unique Git objects; no high-confidence secret formats found.\n"
          )
          print(report.read_text())
          PY

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: secret-history-report
          path: secret-history-report.txt
          if-no-files-found: warn
          retention-days: 14
