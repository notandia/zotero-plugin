name: Prepare JATS release

on:
  push:
    branches:
      - fix/pmc-jats-highlights

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pmc-jats-highlights
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply verified static fixes
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('src/modules/referenceScanner.ts')
          text = path.read_text()

          text, link_loops = re.subn(
              r'Array\.from\(reference\.querySelectorAll\("ext-link, uri"\)\)',
              'Array.from<Element>(reference.querySelectorAll("ext-link, uri") as any)',
              text,
          )
          text, xref_loops = re.subn(
              r'Array\.from\(\s*document\.querySelectorAll\("xref\[ref-type=\'bibr\'\]\[rid\]"\),?\s*\)',
              'Array.from<Element>(document.querySelectorAll("xref[ref-type=\'bibr\'][rid]") as any)',
              text,
              flags=re.S,
          )
          text, ref_loops = re.subn(
              r'Array\.from\(\s*document\.querySelectorAll\("ref-list ref\[id\]"\),?\s*\)',
              'Array.from<Element>(document.querySelectorAll("ref-list ref[id]") as any)',
              text,
              flags=re.S,
          )
          text, opening_regex = re.subn(
              r'/\[\\\[\(\]\\s\*\\d\+\(\?:\\s\*\(\?:\[,;\]\|\\u2013\|\\u2014\|-\)\\s\*\\d\+\)\*\\s\*\[\\\]\)\]/g',
              r'/(?:\[|\()\s*\d+(?:\s*(?:[,;]|\u2013|\u2014|-)\s*\d+)*\s*(?:\]|\))/g',
              text,
          )
          text, anchored_regex = re.subn(
              r'/\^\[\\\[\(\]\\s\*\\d\+\(\?:\\s\*\(\?:\[,;\]\|\\u2013\|\\u2014\|-\)\\s\*\\d\+\)\*\\s\*\[\\\]\)\]\$/',
              r'/^(?:\[|\()\s*\d+(?:\s*(?:[,;]|\u2013|\u2014|-)\s*\d+)*\s*(?:\]|\))$/',
              text,
          )

          if link_loops != 2 or xref_loops != 1 or ref_loops != 1:
              raise SystemExit(
                  f'unexpected DOM replacements: links={link_loops}, xrefs={xref_loops}, refs={ref_loops}'
              )
          if opening_regex != 1 or anchored_regex != 1:
              raise SystemExit(
                  f'unexpected regex replacements: open={opening_regex}, anchored={anchored_regex}'
              )
          if text.count('Array.from<Element>') != 4:
              raise SystemExit('expected four typed DOM conversions')

          path.write_text(text)
          PY
      - name: Install and format
        run: |
          npm install
          npm install --package-lock-only --ignore-scripts
          npx prettier --write \
            src/modules/referenceScanner.ts \
            src/hooks.ts \
            test/mdpiFilter.spec.ts \
            README.md \
            package.json \
            package-lock.json \
            .github/workflows/ci.yml
      - name: Validate
        run: |
          npm run lint:check
          npm run build
      - name: Commit prepared release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-jats-release.yml
          git add \
            src/modules/referenceScanner.ts \
            src/hooks.ts \
            test/mdpiFilter.spec.ts \
            README.md \
            package.json \
            package-lock.json \
            .github/workflows/ci.yml \
            .github/workflows/prepare-jats-release.yml
          git commit -m "fix: prepare precise PMC citation highlighting"
          git push origin HEAD:fix/pmc-jats-highlights
