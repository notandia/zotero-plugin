name: Prepare JATS release

on:
  push:
    branches:
      - fix/pmc-jats-highlights

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pmc-jats-highlights
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply verified static fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/modules/referenceScanner.ts')
          text = path.read_text()

          replacements = [
              (
                  'for (const link of Array.from(reference.querySelectorAll("ext-link, uri"))) {',
                  'for (const link of Array.from<Element>(\n    reference.querySelectorAll("ext-link, uri") as any,\n  )) {',
              ),
              (
                  'for (const xref of Array.from(\n    document.querySelectorAll("xref[ref-type=\'bibr\'][rid]"),\n  )) {',
                  'for (const xref of Array.from<Element>(\n    document.querySelectorAll("xref[ref-type=\'bibr\'][rid]") as any,\n  )) {',
              ),
              (
                  'for (const reference of Array.from(\n    document.querySelectorAll("ref-list ref[id]"),\n  )) {',
                  'for (const reference of Array.from<Element>(\n    document.querySelectorAll("ref-list ref[id]") as any,\n  )) {',
              ),
              (
                  'const links = Array.from(reference.querySelectorAll("ext-link, uri"))',
                  'const links = Array.from<Element>(\n      reference.querySelectorAll("ext-link, uri") as any,\n    )',
              ),
              (
                  r'/[\[(]\s*\d+(?:\s*(?:[,;]|\u2013|\u2014|-)\s*\d+)*\s*[\])]/g',
                  r'/(?:\[|\()\s*\d+(?:\s*(?:[,;]|\u2013|\u2014|-)\s*\d+)*\s*(?:\]|\))/g',
              ),
              (
                  r'/^[\[(]\s*\d+(?:\s*(?:[,;]|\u2013|\u2014|-)\s*\d+)*\s*[\])]$/',
                  r'/^(?:\[|\()\s*\d+(?:\s*(?:[,;]|\u2013|\u2014|-)\s*\d+)*\s*(?:\]|\))$/',
              ),
          ]

          for index, (old, new) in enumerate(replacements, start=1):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'replacement {index} expected once, found {count}')
              text = text.replace(old, new)

          if text.count('Array.from<Element>') != 4:
              raise SystemExit('expected four typed DOM conversions')
          path.write_text(text)
          PY
      - name: Install and format
        run: |
          npm install
          npm install --package-lock-only --ignore-scripts
          npx prettier --write \
            src/modules/referenceScanner.ts \
            src/hooks.ts \
            test/mdpiFilter.spec.ts \
            README.md \
            package.json \
            package-lock.json \
            .github/workflows/ci.yml
      - name: Validate
        run: |
          npm run lint:check
          npm run build
      - name: Commit prepared release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-jats-release.yml
          git add \
            src/modules/referenceScanner.ts \
            src/hooks.ts \
            test/mdpiFilter.spec.ts \
            README.md \
            package.json \
            package-lock.json \
            .github/workflows/ci.yml \
            .github/workflows/prepare-jats-release.yml
          git commit -m "fix: prepare precise PMC citation highlighting"
          git push origin HEAD:fix/pmc-jats-highlights
