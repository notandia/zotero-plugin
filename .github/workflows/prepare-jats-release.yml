name: Prepare JATS release

on:
  push:
    branches:
      - fix/pmc-jats-highlights

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pmc-jats-highlights
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Reconstruct verified reader source
        run: |
          cat .jats-source/part-*.b64 | base64 --decode > src/modules/referenceScanner.ts
          echo "59dd9b1dada7ea0397477b96aa13ba33cc71c7620b73614633c106a7a5ec6458  src/modules/referenceScanner.ts" | sha256sum --check --strict
      - name: Install and format
        run: |
          npm install
          npm install --package-lock-only --ignore-scripts
          npx prettier --write \
            src/modules/referenceScanner.ts \
            src/hooks.ts \
            test/mdpiFilter.spec.ts \
            README.md \
            package.json \
            package-lock.json \
            .github/workflows/ci.yml \
            .github/workflows/prepare-jats-release.yml
      - name: Validate
        run: |
          npm run lint:check
          npm run build
      - name: Commit clean prepared release
        run: |
          rm -rf .jats-source
          rm .github/workflows/prepare-jats-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: prepare precise PMC citation highlighting"
          git push origin HEAD:fix/pmc-jats-highlights
