name: Fix preference regression test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'security/public-ready'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: security/public-ready
          persist-credentials: false
      - name: Correct global preference writes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('test/mdpiFilter.spec.ts')
          text = path.read_text()
          changes = {
              'Zotero.Prefs.set(pref, false);': 'Zotero.Prefs.set(pref, false, true);',
              'Zotero.Prefs.set(pref, true);': 'Zotero.Prefs.set(pref, true, true);',
          }
          for old, new in changes.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one occurrence: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit correction
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/mdpiFilter.spec.ts
          git commit -m 'test: write global Zotero preference correctly'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:security/public-ready
