name: Export patched lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-lock:
    if: github.head_ref == 'security/brace-expansion-5.0.8'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify patched dependency tree
        run: |
          npm audit --audit-level=high
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const vulnerable = Object.entries(lock.packages || {}).filter(([path, entry]) =>
            path.endsWith('/brace-expansion') && entry?.version === '5.0.7'
          );
          if (vulnerable.length) throw new Error(`brace-expansion 5.0.7 remains at: ${vulnerable.map(([path]) => path).join(', ')}`);
          NODE
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: patched-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
