name: Format reader overview

on:
  push:
    branches:
      - "feat/reader-overview-source-highlights"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format reader overview
        run: npx prettier --write src/modules/readerOverview.ts
      - name: Upload formatted source
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: formatted-reader-overview
          path: src/modules/readerOverview.ts
          if-no-files-found: error
          retention-days: 1
