name: Diagnostics

on:
  push:
    branches:
      - feat/working-mdpi-filter

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/working-mdpi-filter

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Capture diagnostics
        run: |
          npm run lint:check > lint-diagnostics.txt 2>&1 || true
          npm run build > build-diagnostics.txt 2>&1 || true

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lint-diagnostics.txt build-diagnostics.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: capture CI diagnostics"
          git push origin HEAD:feat/working-mdpi-filter
