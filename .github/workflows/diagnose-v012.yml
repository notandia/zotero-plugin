name: Diagnose v0.1.2

on:
  push:
    branches:
      - fix/pmc-jats-highlights

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - name: Capture build output
        run: npm run build > build-diagnostics.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: v012-build-diagnostics
          path: build-diagnostics.txt
