name: Prepare null-safe citation offsets

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/pmc-jats-highlights
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Make DOM sibling access null-safe
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/modules/referenceScanner.ts')
          text = path.read_text()
          old = 'ownStart += String(sibling.textContent || "").length;'
          new = 'ownStart += String(sibling?.textContent || "").length;'
          if text.count(old) != 1:
              raise SystemExit(f'expected one sibling access, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Format and validate source
        run: |
          npm install
          npx prettier --write src/modules/referenceScanner.ts
          npm run lint:check
          npx tsc --noEmit
      - name: Commit source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/referenceScanner.ts
          git commit -m "fix: handle nullable citation text nodes"
          git push origin HEAD:fix/pmc-jats-highlights
