name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare-grouped-citation-fix:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/pmc-jats-highlights
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply parent-offset citation mapping
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('src/modules/referenceScanner.ts')
          text = path.read_text()
          replacement = '''function citationGroupAround(xref: Element): CitationMarker {
            const ownText = normalizeWhitespace(xref.textContent || "");
            const parent = xref.parentElement;
            if (parent) {
              const combined = String(parent.textContent || "");
              let ownStart = 0;
              for (const sibling of Array.from(parent.childNodes)) {
                if (sibling === xref) break;
                ownStart += String(sibling.textContent || "").length;
              }
              const ownEnd = ownStart + String(xref.textContent || "").length;
              const groupPattern =
                /(?:\\[|\\()\\s*\\d+(?:\\s*(?:[,;]|\\u2013|\\u2014|-)\\s*\\d+)*\\s*(?:\\]|\\))/g;
              for (const found of combined.matchAll(groupPattern)) {
                const start = found.index || 0;
                const end = start + found[0].length;
                if (start <= ownStart && end >= ownEnd) {
                  return { text: normalizeWhitespace(found[0]), safe: true };
                }
              }
            }

            const directGroup = ownText.match(
              /^(?:\\[|\\()\\s*\\d+(?:\\s*(?:[,;]|\\u2013|\\u2014|-)\\s*\\d+)*\\s*(?:\\]|\\))$/,
            );
            if (directGroup) {
              return { text: directGroup[0], safe: true };
            }

            return { text: ownText, safe: false };
          }

          function citationMarkersForReference'''
          text, count = re.subn(
              r'function citationGroupAround\(xref: Element\): CitationMarker \{.*?\n\}\n\nfunction citationMarkersForReference',
              lambda _match: replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one citationGroupAround replacement, found {count}')
          path.write_text(text)
          PY
      - name: Restore clean workflow set
        run: |
          rm -f .github/workflows/prepare-runtime-fix.yml
          rm -f .github/workflows/diagnose-v012.yml
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches:
                - main
                - "feat/**"
                - "fix/**"
            pull_request:
              branches:
                - main

          jobs:
            lint:
              runs-on: ubuntu-latest
              env:
                GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm
                - name: Install deps
                  run: npm install
                - name: Run lint
                  run: npm run lint:check

            build:
              runs-on: ubuntu-latest
              env:
                GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm
                - name: Install deps
                  run: npm install
                - name: Run build
                  run: npm run build
                - name: Upload build result
                  uses: actions/upload-artifact@v4
                  with:
                    name: build-result
                    path: .scaffold/build

            zotero-runtime:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              env:
                GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm
                - name: Install system dependencies
                  run: |
                    sudo apt-get update
                    sudo apt-get install -y \
                      xvfb \
                      libgtk-3-0 \
                      libdbus-glib-1-2 \
                      libxt6 \
                      libx11-xcb1 \
                      libasound2t64
                - name: Install npm dependencies
                  run: npm install
                - name: Download Zotero 9.0.6
                  run: |
                    curl --fail --location --retry 3 \
                      "https://www.zotero.org/download/client/dl?channel=release&platform=linux-x86_64&version=9.0.6" \
                      --output zotero.tar.xz
                    mkdir zotero-runtime
                    tar -xJf zotero.tar.xz -C zotero-runtime
                    ZOTERO_BIN="$(find "$GITHUB_WORKSPACE/zotero-runtime" -type f -name zotero -perm -u+x | head -n 1)"
                    test -n "$ZOTERO_BIN"
                    echo "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=$ZOTERO_BIN" >> "$GITHUB_ENV"
                    echo "ZOTERO_PLUGIN_PROFILE_PATH=$RUNNER_TEMP/zotero-profile" >> "$GITHUB_ENV"
                    echo "ZOTERO_PLUGIN_DATA_DIR=$RUNNER_TEMP/zotero-data" >> "$GITHUB_ENV"
                    mkdir -p "$RUNNER_TEMP/zotero-profile" "$RUNNER_TEMP/zotero-data"
                - name: Run Zotero runtime tests
                  run: xvfb-run --auto-servernum npm test 2>&1 | tee runtime-test-output.txt
                - name: Validate runtime test result
                  run: grep -Fq "Test run completed - 11 passed" runtime-test-output.txt
                - name: Upload runtime test report
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: zotero-runtime-test-report
                    path: runtime-test-output.txt
          YAML
      - name: Validate prepared branch
        run: |
          npm install
          npx prettier --write src/modules/referenceScanner.ts .github/workflows/ci.yml
          npm run lint:check
          npm run build
      - name: Commit prepared branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: map grouped JATS citations by parent offsets"
          git push origin HEAD:fix/pmc-jats-highlights

  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install deps
        run: npm install
      - name: Run lint
        run: npm run lint:check

  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install deps
        run: npm install
      - name: Run build
        run: npm run build
      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: .scaffold/build

  zotero-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgtk-3-0 \
            libdbus-glib-1-2 \
            libxt6 \
            libx11-xcb1 \
            libasound2t64
      - name: Install npm dependencies
        run: npm install
      - name: Download Zotero 9.0.6
        run: |
          curl --fail --location --retry 3 \
            "https://www.zotero.org/download/client/dl?channel=release&platform=linux-x86_64&version=9.0.6" \
            --output zotero.tar.xz
          mkdir zotero-runtime
          tar -xJf zotero.tar.xz -C zotero-runtime
          ZOTERO_BIN="$(find "$GITHUB_WORKSPACE/zotero-runtime" -type f -name zotero -perm -u+x | head -n 1)"
          test -n "$ZOTERO_BIN"
          echo "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=$ZOTERO_BIN" >> "$GITHUB_ENV"
          echo "ZOTERO_PLUGIN_PROFILE_PATH=$RUNNER_TEMP/zotero-profile" >> "$GITHUB_ENV"
          echo "ZOTERO_PLUGIN_DATA_DIR=$RUNNER_TEMP/zotero-data" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/zotero-profile" "$RUNNER_TEMP/zotero-data"
      - name: Run Zotero runtime tests
        run: xvfb-run --auto-servernum npm test 2>&1 | tee runtime-test-output.txt
      - name: Validate runtime test result
        run: grep -Fq "Test run completed - 11 passed" runtime-test-output.txt
      - name: Upload runtime test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zotero-runtime-test-report
          path: runtime-test-output.txt
