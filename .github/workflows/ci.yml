name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "security/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  lockfile-refresh:
    if: github.event_name == 'push' && github.ref == 'refs/heads/security/brace-expansion-5.0.8'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/brace-expansion-5.0.8
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Regenerate and verify dependency lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=high
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const entries = Object.entries(lock.packages || {}).filter(([path]) => path.endsWith('/brace-expansion') || path === 'node_modules/brace-expansion');
          if (!entries.length) throw new Error('brace-expansion entry is missing');
          for (const [path, entry] of entries) {
            if (entry?.version !== '5.0.9') throw new Error(`${path} resolved to ${entry?.version}`);
          }
          NODE
      - name: Commit only package-lock.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "package-lock.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security: refresh audited dependency lockfile"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:security/brace-expansion-5.0.8

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run formatter and linter
        run: npm run lint:check

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Reject vulnerable picomatch versions
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const entry = lock.packages?.['node_modules/picomatch'];
          if (!entry) process.exit(0);
          const [major, minor, patch] = entry.version.split('.').map(Number);
          if (major < 4 || (major === 4 && minor === 0 && patch < 4)) {
            throw new Error(`picomatch remains vulnerable: ${entry.version}`);
          }
          NODE

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build XPI
        run: npm run build
      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          XPI="$(find .scaffold/build -type f -name '*.xpi' -print -quit)"
          test -n "$XPI"
          unzip -tq "$XPI"
          unzip -p "$XPI" manifest.json > /tmp/manifest.json
          python - <<'PY'
          import json
          package = json.load(open('package.json'))
          manifest = json.load(open('/tmp/manifest.json'))
          assert manifest['version'] == package['version'], (manifest, package['version'])
          assert manifest['name'] == package['config']['addonName'], manifest
          PY
          sha256sum "$XPI" | tee .scaffold/build/SHA256SUMS
      - name: Upload build result
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: build-result
          path: .scaffold/build
          if-no-files-found: error
          retention-days: 14

  zotero-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgtk-3-0 \
            libdbus-glib-1-2 \
            libxt6 \
            libx11-xcb1 \
            libasound2t64
      - name: Install npm dependencies
        run: npm ci
      - name: Download and verify Zotero 9.0.6
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://www.zotero.org/download/client/dl?channel=release&platform=linux-x86_64&version=9.0.6" \
            --output zotero.tar.xz
          echo "0db6e8f94bd0d84e862e6ef5c3e217030e173c0cd3c6dfbc836252c650fea3dd  zotero.tar.xz" | sha256sum --check --strict
          mkdir zotero-runtime
          tar -xJf zotero.tar.xz -C zotero-runtime
          ZOTERO_BIN="$(find "$GITHUB_WORKSPACE/zotero-runtime" -type f -name zotero -perm -u+x | head -n 1)"
          test -n "$ZOTERO_BIN"
          echo "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=$ZOTERO_BIN" >> "$GITHUB_ENV"
          echo "ZOTERO_PLUGIN_PROFILE_PATH=$RUNNER_TEMP/zotero-profile" >> "$GITHUB_ENV"
          echo "ZOTERO_PLUGIN_DATA_DIR=$RUNNER_TEMP/zotero-data" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/zotero-profile" "$RUNNER_TEMP/zotero-data"
      - name: Run Zotero runtime tests
        shell: bash
        run: |
          set -o pipefail
          xvfb-run --auto-servernum npm test 2>&1 | tee runtime-test-output.txt
      - name: Upload runtime test report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: zotero-runtime-test-report
          path: runtime-test-output.txt
          if-no-files-found: warn
          retention-days: 14
