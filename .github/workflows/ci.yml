name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm install
      - name: Run lint
        run: npm run lint:check

  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm install
      - name: Package and validate XPI
        run: |
          set +e
          npx zotero-plugin build
          SCAFFOLD_STATUS=$?
          set -e
          echo "zotero-plugin build exit status: $SCAFFOLD_STATUS"
          npx tsc --noEmit
          XPI="$(find .scaffold/build -type f -name '*.xpi' -print -quit)"
          test -n "$XPI"
          unzip -tq "$XPI"
          unzip -p "$XPI" manifest.json > /tmp/mdpi-filter-manifest.json
          python - <<'PY'
          import json
          with open('/tmp/mdpi-filter-manifest.json') as file:
              manifest = json.load(file)
          assert manifest['version'] == '0.1.2', manifest
          assert manifest['name'] == 'MDPI Filter', manifest
          PY
      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: .scaffold/build

  zotero-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgtk-3-0 \
            libdbus-glib-1-2 \
            libxt6 \
            libx11-xcb1 \
            libasound2t64
      - name: Install npm dependencies
        run: npm install
      - name: Download Zotero 9.0.6
        run: |
          curl --fail --location --retry 3 \
            "https://www.zotero.org/download/client/dl?channel=release&platform=linux-x86_64&version=9.0.6" \
            --output zotero.tar.xz
          mkdir zotero-runtime
          tar -xJf zotero.tar.xz -C zotero-runtime
          ZOTERO_BIN="$(find "$GITHUB_WORKSPACE/zotero-runtime" -type f -name zotero -perm -u+x | head -n 1)"
          test -n "$ZOTERO_BIN"
          echo "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=$ZOTERO_BIN" >> "$GITHUB_ENV"
          echo "ZOTERO_PLUGIN_PROFILE_PATH=$RUNNER_TEMP/zotero-profile" >> "$GITHUB_ENV"
          echo "ZOTERO_PLUGIN_DATA_DIR=$RUNNER_TEMP/zotero-data" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/zotero-profile" "$RUNNER_TEMP/zotero-data"
      - name: Run Zotero runtime tests
        run: xvfb-run --auto-servernum npm test 2>&1 | tee runtime-test-output.txt
      - name: Validate runtime test result
        run: grep -Fq "Test run completed - 11 passed" runtime-test-output.txt
      - name: Upload runtime test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zotero-runtime-test-report
          path: runtime-test-output.txt
