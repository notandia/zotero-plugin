name: Prepare PMC-source references

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/pmc-jats-highlights
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Query the PMC source record
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('src/modules/referenceScanner.ts')
          text = path.read_text()

          text, metadata_count = re.subn(
              r'async function lookupPMCMetadata\(.*?\n\}\n\nfunction europePMCReferenceSnippet',
              'function europePMCReferenceSnippet',
              text,
              count=1,
              flags=re.S,
          )
          if metadata_count != 1:
              raise SystemExit(f'expected one metadata helper, found {metadata_count}')

          old_signature = '''async function fetchOrderedEuropePMCReferences(
            pmid: string,
          ): Promise<MDPIReferenceMatch[] | undefined> {'''
          new_signature = '''async function fetchOrderedEuropePMCReferences(
            pmcid: string,
          ): Promise<MDPIReferenceMatch[] | undefined> {'''
          if text.count(old_signature) != 1:
              raise SystemExit('ordered-reference signature mismatch')
          text = text.replace(old_signature, new_signature)

          old_url = '''`https://www.ebi.ac.uk/europepmc/webservices/rest/MED/${pmid}/references`,'''
          new_url = '''`https://www.ebi.ac.uk/europepmc/webservices/rest/PMC/${pmcid}/references`,'''
          if text.count(old_url) != 1:
              raise SystemExit('ordered-reference URL mismatch')
          text = text.replace(old_url, new_url)

          old_fallback = '''              const metadata = await lookupPMCMetadata(normalized);
              if (!metadata?.pmid) return undefined;
              return fetchOrderedEuropePMCReferences(metadata.pmid);'''
          new_fallback = '''              return fetchOrderedEuropePMCReferences(normalized);'''
          if text.count(old_fallback) != 1:
              raise SystemExit('ordered-reference fallback mismatch')
          text = text.replace(old_fallback, new_fallback)

          path.write_text(text)
          PY
      - name: Format and validate source
        run: |
          npm install
          npx prettier --write src/modules/referenceScanner.ts
          npm run lint:check
      - name: Commit source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/referenceScanner.ts
          git commit -m "fix: retrieve ordered references from the PMC source record"
          git push origin HEAD:fix/pmc-jats-highlights
