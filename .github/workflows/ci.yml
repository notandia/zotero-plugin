name: Prepare Europe PMC full text

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/pmc-jats-highlights
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Use Europe PMC fullTextXML
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/modules/referenceScanner.ts')
          text = path.read_text()
          old_constant = 'const NCBI_EFETCH = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi";\n'
          if text.count(old_constant) != 1:
              raise SystemExit(f'expected one EFetch constant, found {text.count(old_constant)}')
          text = text.replace(old_constant, '')
          old_request = '''    const url = new URL(NCBI_EFETCH);
              url.searchParams.set("db", "pmc");
              url.searchParams.set("id", normalized.replace(/^PMC/i, ""));
              url.searchParams.set("retmode", "xml");
              url.searchParams.set("tool", "MDPIFilterZotero");'''
          new_request = '''    const url = new URL(
                `https://www.ebi.ac.uk/europepmc/webservices/rest/${normalized}/fullTextXML`,
              );'''
          if text.count(old_request) != 1:
              raise SystemExit(f'expected one EFetch request block, found {text.count(old_request)}')
          path.write_text(text.replace(old_request, new_request))
          PY
      - name: Format and validate source
        run: |
          npm install
          npx prettier --write src/modules/referenceScanner.ts
          npm run lint:check
      - name: Commit source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/referenceScanner.ts
          git commit -m "fix: retrieve PMC JATS XML from Europe PMC"
          git push origin HEAD:fix/pmc-jats-highlights
